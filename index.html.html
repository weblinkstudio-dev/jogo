  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bgDark: '#0B1020',
            bgCard: '#151B2E',
            purpleMain: '#7C3AED',
            purpleLight: '#A78BFA',
            blueMain: '#2563EB',
            greenMain: '#22C55E',
            redMain: '#EF4444',
            lightGray: '#CBD5E1',
            darkGray: '#64748B'
          },
          fontFamily: {
            poppins: ['Poppins', 'sans-serif'],
            inter: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #0B1020;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    h1, h2, h3, h4, .font-heading {
      font-family: 'Poppins', sans-serif;
    }
    /* Custom Scrollbar for inner elements */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #0B1020;
    }
    ::-webkit-scrollbar-thumb {
      background: #151B2E;
      border-radius: 4px;
    }
    /* Pulsing animations & special cards */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
      50% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.8); }
    }
    .impostor-card-glow {
      animation: pulseGlow 2s infinite;
    }
    @keyframes spinWheel {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .spinning-active {
      animation: spinWheel 0.15s infinite;
    }
  </style>
</head>

    /* ==========================================================================
       2. GAME STATE MANAGEMENT
       ========================================================================== */
    const STORAGE_KEY = 'o_impostor_celula_state_v1';

    let gameState = {
      view: 'HOME', // HOME, HOW_TO_PLAY, SETUP, LEADER_DASHBOARD, HAND_OVER, CLUES, INVESTIGATION, VOTING, REVEAL, GAME_OVER
      numPairs: 8,
      currentRound: 0,
      scores: {}, // { pairNum: score }
      impostorStats: {}, // { pairNum: timesImpostor }
      usedPairsIndexes: [],
      currentPairData: null, // { normalWord, impostorWord, impostorPair }
      pairViewedStatus: {}, // { pairNum: true/false }
      pairCluesGiven: {}, // { pairNum: true/false }
      history: [], // [{ round, normalWord, impostorWord, impostorPair, accusedPair, caught }]
      lastImpostorPair: null,
      selectedPairToDeliver: null,
      deliveryStep: 'CONFIRM', // CONFIRM, WORD, HIDDEN
      timerSeconds: 60,
      timerRunning: false,
      timerInterval: null
    };

    // Audio Engine via Web Audio API
    function playBeep(freq = 440, duration = 0.1, type = 'sine') {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function triggerHaptic() {
      if (navigator.vibrate) {
        navigator.vibrate(40);
      }
    }

    /* Save and Load state */
    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
    }

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          gameState = JSON.parse(saved);
          return true;
        } catch(e) {
          console.error("Failed to load state", e);
        }
      }
      return false;
    }

    function resetGameCompletely() {
      localStorage.removeItem(STORAGE_KEY);
      gameState = {
        view: 'HOME',
        numPairs: 8,
        currentRound: 0,
        scores: {},
        impostorStats: {},
        usedPairsIndexes: [],
        currentPairData: null,
        pairViewedStatus: {},
        pairCluesGiven: {},
        history: [],
        lastImpostorPair: null,
        selectedPairToDeliver: null,
        deliveryStep: 'CONFIRM',
        timerSeconds: 60,
        timerRunning: false,
        timerInterval: null
      };
      closeLeaderModal();
      renderApp();
    }

    function openLeaderModal() {
      document.getElementById('leader-modal').classList.remove('hidden');
    }

    function closeLeaderModal() {
      document.getElementById('leader-modal').classList.add('hidden');
    }

    function confirmAction(text, onOk) {
      document.getElementById('leader-modal').classList.add('hidden');
      const confirmModal = document.getElementById('confirm-modal');
      document.getElementById('confirm-modal-text').innerText = text;
      
      const cancelBtn = document.getElementById('confirm-modal-cancel');
      const okBtn = document.getElementById('confirm-modal-ok');
      
      const cleanUp = () => {
        confirmModal.classList.add('hidden');
        cancelBtn.onclick = null;
        okBtn.onclick = null;
      };

      cancelBtn.onclick = cleanUp;
      okBtn.onclick = () => {
        cleanUp();
        onOk();
      };

      confirmModal.classList.remove('hidden');
    }

    function revealSecretLeaderInfo() {
      closeLeaderModal();
      if (!gameState.currentPairData) {
        alert('Nenhuma rodada em andamento.');
        return;
      }
      const secretBox = document.getElementById('secret-info-content');
      secretBox.innerHTML = `
        <p><strong>Palavra Normal:</strong> <span class="text-greenMain font-bold">${gameState.currentPairData.normalWord}</span></p>
        <p><strong>Palavra Impostor:</strong> <span class="text-redMain font-bold">${gameState.currentPairData.impostorWord}</span></p>
        <p><strong>🚨 IMPOSTOR:</strong> <span class="text-amber-400 font-extrabold text-base">Dupla ${gameState.currentPairData.impostorPair}</span></p>
      `;
      document.getElementById('secret-info-modal').classList.remove('hidden');
    }

    function updateHeaderVisibility() {
      const leaderBtn = document.getElementById('leader-control-btn');
      if (['LEADER_DASHBOARD', 'HAND_OVER', 'CLUES', 'INVESTIGATION', 'VOTING', 'REVEAL'].includes(gameState.view)) {
        leaderBtn.classList.remove('hidden');
      } else {
        leaderBtn.classList.add('hidden');
      }
    }

    /* ==========================================================================
       4. GAME MECHANICS & LOGIC
       ========================================================================== */
    function initializeScores(num) {
      gameState.scores = {};
      gameState.impostorStats = {};
      for (let i = 1; i <= num; i++) {
        gameState.scores[i] = 0;
        gameState.impostorStats[i] = 0;
      }
    }

    function startNewRound() {
      gameState.currentRound++;
      
      // Select word pair without immediate repetition
      if (gameState.usedPairsIndexes.length >= WORD_PAIRS.length) {
        gameState.usedPairsIndexes = [];
      }

      let availableIndexes = [];
      for (let i = 0; i < WORD_PAIRS.length; i++) {
        if (!gameState.usedPairsIndexes.includes(i)) {
          availableIndexes.push(i);
        }
      }

      const randIndex = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
      gameState.usedPairsIndexes.push(randIndex);
      const chosenWordPair = WORD_PAIRS[randIndex];

      // Pick Impostor pair (Avoid consecutive impostor if > 2 pairs)
      let availablePairs = [];
      for (let p = 1; p <= gameState.numPairs; p++) {
        if (gameState.numPairs > 2 && p === gameState.lastImpostorPair) {
          continue;
        }
        availablePairs.push(p);
      }
      const impostorPair = availablePairs[Math.floor(Math.random() * availablePairs.length)];
      gameState.lastImpostorPair = impostorPair;

      // Track stats
      gameState.impostorStats[impostorPair] = (gameState.impostorStats[impostorPair] || 0) + 1;

      gameState.currentPairData = {
        normalWord: chosenWordPair.normal,
        impostorWord: chosenWordPair.impostor,
        impostorPair: impostorPair
      };

      // Reset pair check statuses
      gameState.pairViewedStatus = {};
      gameState.pairCluesGiven = {};
      for (let p = 1; p <= gameState.numPairs; p++) {
        gameState.pairViewedStatus[p] = false;
        gameState.pairCluesGiven[p] = false;
      }

      gameState.view = 'LEADER_DASHBOARD';
      saveState();
      renderApp();
    }

    function restartRound() {
      // Re-run current round without advancing round count
      gameState.currentRound--;
      startNewRound();
    }

    /* ==========================================================================

       ========================================================================== */

      updateHeaderVisibility();
      const viewport = document.getElementById('app-viewport');

      switch (gameState.view) {
        case 'HOME':
          renderHome(viewport);
          break;
        case 'HOW_TO_PLAY':
          renderHowToPlay(viewport);
          break;

        case 'HAND_OVER':

          break;
        case 'GAME_OVER':
          renderGameOver(viewport);

        default:

            <p class="text-xs text-darkGray">Cada dupla deve dar UMA dica curta sobre sua palavra.</p>
          </div>

          <div class="bg-bgCard p-3.5 rounded-2xl border border-purpleMain/30 text-xs text-lightGray space-y-1">
            <p class="font-semibold text-purpleLight">💡 Regra das Dicas:</p>
            <p>Fale uma palavra ou frase simples. Não diga a palavra exata!</p>
          </div>

          <div class="space-y-2 max-h-64 overflow-y-auto pr-1">
            ${Array.from({ length: gameState.numPairs }, (_, i) => i + 1).map(p => {
              const checked = gameState.pairCluesGiven[p];
              return `
                <div onclick="toggleClueGiven(${p})" class="p-3 rounded-2xl border flex items-center justify-between cursor-pointer transition active:scale-98 ${
                  checked ? 'bg-greenMain/10 border-greenMain/40 text-green-300' : 'bg-bgCard border-gray-800 text-white'
                }">
                  <span class="text-xs font-bold">Dupla ${p}</span>
                  <span class="text-xs font-bold px-2 py-1 rounded-lg ${checked ? 'bg-greenMain text-white' : 'bg-slate-800 text-gray-400'}">
                    ${checked ? '✓ Dica dada' : 'Pendente'}
                  </span>
                </div>
              `;
            }).join('')}
          </div>

          <button id="btn-to-investigation" class="w-full bg-gradient-to-r from-purpleMain to-blueMain text-white font-extrabold py-4 rounded-2xl text-sm shadow-xl active:scale-95 transition flex items-center justify-center gap-2">
            <span>🕵️</span> TODAS AS DUPLAS JÁ DERAM A DICA
          </button>
        </div>
      `;

      document.getElementById('btn-to-investigation').onclick = () => {
        gameState.view = 'INVESTIGATION';
        gameState.timerSeconds = 60;
        gameState.timerRunning = false;
        saveState();
        renderApp();
      };
    }

    function toggleClueGiven(pairNum) {
      gameState.pairCluesGiven[pairNum] = !gameState.pairCluesGiven[pairNum];
      renderApp();
    }

    // --- SCREEN 7: INVESTIGATION & TIMER ---
    function renderInvestigation(container) {
      container.innerHTML = `
        <div class="space-y-5 my-auto py-2 text-center">
          <div class="space-y-1">
            <span class="text-4xl">🕵️</span>
            <h2 class="text-2xl font-bold text-white">HORA DA INVESTIGAÇÃO</h2>
            <p class="text-xs text-darkGray max-w-xs mx-auto">
              Conversem, analisem as dicas suspeitas e tentem descobrir quem é o impostor!
            </p>
          </div>

          <!-- Timer Box -->
          <div class="bg-bgCard p-6 rounded-3xl border border-purpleMain/30 space-y-3 shadow-xl max-w-xs mx-auto">
            <span class="text-xs font-bold text-purpleLight uppercase tracking-wider block">Cronômetro de Discussão</span>
            <div id="timer-display" class="text-5xl font-black text-white font-mono tracking-wider">
              ${formatTime(gameState.timerSeconds)}
            </div>
            
            <div class="flex gap-2 justify-center pt-2">
              <button id="btn-timer-toggle" class="bg-purpleMain hover:bg-purple-600 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow active:scale-95 transition">
                ${gameState.timerRunning ? 'PAUSAR' : 'INICIAR 60s'}
              </button>
              <button id="btn-timer-reset" class="bg-slate-800 hover:bg-slate-700 text-lightGray font-semibold text-xs px-3 py-2.5 rounded-xl border border-slate-700 active:scale-95 transition">
                RESET
              </button>
            </div>
          </div>

          <div class="space-y-2 pt-2">
            <button id="btn-to-voting" class="w-full bg-gradient-to-r from-purpleMain to-blueMain text-white font-extrabold py-4 rounded-2xl text-base shadow-xl active:scale-95 transition flex items-center justify-center gap-2">
              <span>🗳️</span> IR PARA VOTAÇÃO
            </button>
          </div>
        </div>
      `;

      document.getElementById('btn-timer-toggle').onclick = () => {
        if (gameState.timerRunning) {
          clearInterval(gameState.timerInterval);
          gameState.timerRunning = false;
        } else {
          gameState.timerRunning = true;
          gameState.timerInterval = setInterval(() => {
            if (gameState.timerSeconds > 0) {
              gameState.timerSeconds--;
              const timerDisplay = document.getElementById('timer-display');
              if (timerDisplay) timerDisplay.innerText = formatTime(gameState.timerSeconds);
              if (gameState.timerSeconds <= 5 && gameState.timerSeconds > 0) playBeep(800, 0.05);
            } else {
              clearInterval(gameState.timerInterval);
              gameState.timerRunning = false;
              playBeep(1000, 0.4, 'square');
              triggerHaptic();
            }
          }, 1000);
        }
        renderApp();
      };

      document.getElementById('btn-timer-reset').onclick = () => {
        clearInterval(gameState.timerInterval);
        gameState.timerRunning = false;
        gameState.timerSeconds = 60;
        renderApp();
      };

      document.getElementById('btn-to-voting').onclick = () => {
        clearInterval(gameState.timerInterval);
        gameState.timerRunning = false;
        gameState.view = 'VOTING';
        saveState();
        renderApp();
      };
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    // --- SCREEN 8: VOTING ---
    function renderVoting(container) {
      container.innerHTML = `
        <div class="space-y-4 py-2">
          <div class="text-center space-y-1">
            <span class="text-3xl">🗳️</span>
            <h2 class="text-2xl font-bold text-white">HORA DA VOTAÇÃO</h2>
            <p class="text-xs text-darkGray">Qual dupla foi a mais votada pelo grupo?</p>
          </div>

          <div class="grid grid-cols-2 gap-3 max-h-80 overflow-y-auto pr-1">
            ${Array.from({ length: gameState.numPairs }, (_, i) => i + 1).map(p => `
              <button onclick="confirmVoteForPair(${p})" class="bg-bgCard hover:bg-purpleMain/20 border border-purpleMain/40 p-4 rounded-2xl flex flex-col items-center justify-center space-y-1 active:scale-95 transition shadow-lg">
                <span class="text-xs text-purpleLight font-bold">DUPLA</span>
                <span class="text-2xl font-black text-white">${p}</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function confirmVoteForPair(pairNum) {
      confirmAction(`DUPLA ${pairNum} FOI ACUSADA!\nConfirmar votação?`, () => {
        processVoteResult(pairNum);
      });
    }

    function processVoteResult(accusedPair) {
      const data = gameState.currentPairData;
      const caught = (accusedPair === data.impostorPair);

      if (caught) {
        // Group got it right! Group members/participating pairs gain +1
        for (let p = 1; p <= gameState.numPairs; p++) {
          if (p !== data.impostorPair) {
            gameState.scores[p] = (gameState.scores[p] || 0) + 1;
          }
        }
      } else {
        // Impostor escaped! Impostor gets +2
        gameState.scores[data.impostorPair] = (gameState.scores[data.impostorPair] || 0) + 2;
      }

      // Record History
      gameState.history.push({
        round: gameState.currentRound,
        normalWord: data.normalWord,
        impostorWord: data.impostorWord,
        impostorPair: data.impostorPair,
        accusedPair: accusedPair,
        caught: caught
      });

      gameState.lastVoteResult = {
        accusedPair: accusedPair,
        caught: caught
      };

      gameState.view = 'REVEAL';
      saveState();
      renderApp();
    }

    // --- SCREEN 9: REVEAL & SCORING ---
    function renderReveal(container) {
      const data = gameState.currentPairData;
      const res = gameState.lastVoteResult;

      container.innerHTML = `
        <div class="space-y-5 my-auto py-4 text-center">
          
          ${res.caught ? `
            <div class="bg-greenMain/10 border-2 border-greenMain p-6 rounded-3xl space-y-3 shadow-2xl">
              <span class="text-5xl block animate-bounce">🎉</span>
              <h2 class="text-2xl font-black text-greenMain uppercase">PEGARAM O IMPOSTOR!</h2>
              <p class="text-sm font-semibold text-white">A <strong>Dupla ${data.impostorPair}</strong> era realmente o Impostor!</p>
              <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
                <p class="text-gray-300">Palavra do Grupo: <strong class="text-greenMain">${data.normalWord}</strong></p>
                <p class="text-gray-300">Palavra do Impostor: <strong class="text-redMain">${data.impostorWord}</strong></p>
              </div>
              <div class="inline-block bg-greenMain text-white font-bold text-xs px-3 py-1 rounded-full">
                +1 Ponto para o Grupo!
              </div>
            </div>
          ` : `
            <div class="bg-redMain/10 border-2 border-redMain p-6 rounded-3xl space-y-3 shadow-2xl impostor-card-glow">
              <span class="text-5xl block">😈</span>
              <h2 class="text-2xl font-black text-redMain uppercase">NÃO ERA O IMPOSTOR!</h2>
              <p class="text-sm font-semibold text-white">A <strong>Dupla ${res.accusedPair}</strong> era inocente!</p>
              <p class="text-xs text-red-200">O Impostor conseguiu se esconder com sucesso!</p>
              <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
                <p class="text-amber-400 font-bold">🚨 Impostor Secreto: Dupla ${data.impostorPair}</p>
                <p class="text-gray-300">Palavra do Grupo: <strong class="text-greenMain">${data.normalWord}</strong> | Impostor: <strong class="text-redMain">${data.impostorWord}</strong></p>
              </div>
              <div class="inline-block bg-redMain text-white font-bold text-xs px-3 py-1 rounded-full">
                +2 Pontos para o Impostor (Dupla ${data.impostorPair})!
              </div>
            </div>
          `}

          <!-- Updated Score Table -->
          <div class="bg-bgCard p-4 rounded-2xl border border-purpleMain/30 text-left space-y-2">
            <h4 class="text-xs font-bold text-purpleLight uppercase">🏆 Placar Geral Atualizado</h4>
            <div class="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto pt-1">
              ${Object.keys(gameState.scores).map(p => `
                <div class="p-2 bg-slate-900/70 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                  <span class="font-bold text-white">Dupla ${p}</span>
                  <span class="font-extrabold text-purpleLight">${gameState.scores[p]} pts</span>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="flex gap-2">
            <button id="btn-next-round" class="flex-1 bg-gradient-to-r from-purpleMain to-blueMain text-white font-extrabold py-4 rounded-2xl text-sm shadow-xl active:scale-95 transition">
              🔄 NOVA RODADA
            </button>
            <button id="btn-end-game-early" class="bg-slate-800 hover:bg-slate-700 text-lightGray font-bold px-4 py-4 rounded-2xl text-xs border border-slate-700 active:scale-95 transition">
              🏁 ENCERRAR
            </button>
          </div>
        </div>
      `;

      document.getElementById('btn-next-round').onclick = () => {
        startNewRound();
      };

      document.getElementById('btn-end-game-early').onclick = () => {
        confirmAction('Deseja encerrar a partida e ver o resultado final?', endGame);
      };
    }

    function endGame() {
      gameState.view = 'GAME_OVER';
      saveState();
      renderApp();
    }

    // --- SCREEN 10: END OF GAME & STATS ---
    function renderGameOver(container) {
      // Find top scorer
      let maxScore = -1;
      let winners = [];
      Object.keys(gameState.scores).forEach(p => {
        const sc = gameState.scores[p];
        if (sc > maxScore) {
          maxScore = sc;
          winners = [p];
        } else if (sc === maxScore) {
          winners.push(p);
        }
      });

      let caughtCount = 0;
      let escapedCount = 0;
      gameState.history.forEach(h => {
        if (h.caught) caughtCount++;
        else escapedCount++;
      });

      container.innerHTML = `
        <div class="space-y-5 my-auto py-4 text-center">
          <div>
            <span class="text-5xl block">🏆</span>
            <h2 class="text-3xl font-black text-white">FIM DE JOGO</h2>
            <p class="text-xs text-purpleLight">Partida encerrada na Célula de Conexão!</p>
          </div>

          <!-- Winner Spotlight Card -->
          <div class="bg-gradient-to-tr from-purpleMain/30 to-blueMain/30 border-2 border-purpleLight/50 p-5 rounded-3xl space-y-2 shadow-2xl">
            <span class="text-xs font-extrabold text-amber-400 uppercase tracking-widest block">🎉 Vencedor(es) da Partida</span>
            <h3 class="text-2xl font-black text-white">
              ${winners.map(w => `Dupla ${w}`).join(' & ')}
            </h3>
            <span class="text-sm font-bold text-purpleLight block">${maxScore} Pontos</span>
          </div>

          <!-- Final Scoreboard -->
          <div class="bg-bgCard p-4 rounded-2xl border border-gray-800 text-left space-y-2">
            <h4 class="text-xs font-bold text-purpleLight uppercase">📊 Placar Final</h4>
            <div class="space-y-1.5 max-h-40 overflow-y-auto pr-1">
              ${Object.keys(gameState.scores).sort((a,b) => gameState.scores[b] - gameState.scores[a]).map(p => `
                <div class="p-2.5 bg-slate-900/80 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                  <span class="font-bold text-white">Dupla ${p}</span>
                  <span class="font-extrabold text-purpleLight">${gameState.scores[p]} pts</span>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Game Statistics -->
          <div class="bg-bgCard p-4 rounded-2xl border border-gray-800 text-left space-y-2 text-xs">
            <h4 class="text-xs font-bold text-purpleLight uppercase">📈 Estatísticas da Partida</h4>
            <div class="grid grid-cols-2 gap-2 text-center pt-1">
              <div class="bg-slate-900/60 p-2 rounded-xl">
                <span class="text-[10px] text-darkGray font-bold uppercase block">Rodadas Jogadas</span>
                <span class="text-base font-black text-white">${gameState.history.length}</span>
              </div>
              <div class="bg-slate-900/60 p-2 rounded-xl">
                <span class="text-[10px] text-darkGray font-bold uppercase block">Impostores Pegos</span>
                <span class="text-base font-black text-greenMain">${caughtCount}</span>
              </div>
            </div>
          </div>

          <button id="btn-restart-new-game" class="w-full bg-gradient-to-r from-purpleMain to-blueMain text-white font-extrabold py-4 rounded-2xl text-base shadow-xl active:scale-95 transition">
            🎮 NOVA PARTIDA
          </button>
        </div>
      `;

      document.getElementById('btn-restart-new-game').onclick = () => {
        showSetupScreen();
      };
    }

    /* ==========================================================================
       6. APPLICATION INITIALIZATION
       ========================================================================== */
    window.onload = function() {
      if (loadState() && gameState.view && gameState.view !== 'HOME') {
        renderApp();
      } else {
        gameState.view = 'HOME';
        renderApp();
      }
    };
  </script>
</body>
</html>
